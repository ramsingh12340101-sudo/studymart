<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyMart - CBSE Notes & PYQ Papers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #1a3c6e;
      --brand-light: #2456a4;
      --accent: #f4a623;
      --red: #e53935;
      --green: #1c7721;
      --bg: #f7f8fc;
      --surface: #ffffff;
      --border: #e2e6f0;
      --text: #1a1f2e;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(26,60,110,0.08);
      --shadow-lg: 0 8px 32px rgba(26,60,110,0.13);
    }
    body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #root { min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
